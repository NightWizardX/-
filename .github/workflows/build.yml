name: Build APK

on:
  push:
  workflow_dispatch:

# Read-only by default; only the release job below may write.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      signed: ${{ steps.key.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare release signing key
        id: key
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode --ignore-garbage > "$RUNNER_TEMP/release.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/release.p12" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret SIGNING_KEYSTORE_BASE64 is not set: this APK is signed with a throwaway key, so it is kept as a run artifact and not published as a release. See README."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          gradle testReleaseUnitTest assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk expense-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: expense-tracker.apk
          if-no-files-found: error

  release:
    needs: build
    # Only the default branch (or a manual run) replaces the APK people install, and only when it is
    # signed with the permanent key: a throwaway-signed APK can't update an installed copy.
    if: >-
      needs.build.outputs.signed == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: expense-tracker-apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: บันทึกรายจ่าย 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: expense-tracker.apk
          body: |
            ดาวน์โหลด **expense-tracker.apk** ด้านล่าง แล้วเปิดบนมือถือ Android เพื่อติดตั้ง
            Build จาก commit ${{ github.sha }}
